<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آزمون">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/skeletons.css">
<link rel="stylesheet" href="css/print.css" media="print">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="آزمون">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل معلم</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="app-header">
    <h2>👨‍🏫 پنل معلم</h2>
    <div class="user-info">
      <span class="user-name" id="userName">—</span>
      <div class="user-avatar" id="userAvatar">؟</div>
      <button class="btn-icon" onclick="toggleTheme()" title="تغییر تم">
        <span id="themeIcon">🌙</span>
      </button>
      <button class="btn-icon" onclick="logout()" title="خروج">🚪</button>
    </div>
  </header>

  <main class="container">

    <!-- آمار -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-value" id="statExams">—</div>
        <div class="stat-label">آزمون‌ها</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statSubmissions">—</div>
        <div class="stat-label">پاسخ‌ها</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statStudents">—</div>
        <div class="stat-label">دانش‌آموزان</div>
      </div>
    </div>

    <!-- آزمون‌ها -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 class="section-title" style="margin:0;">📝 آزمون‌ها</h3>
      <button class="btn btn-primary" onclick="openUploadModal()">
        + آزمون جدید
      </button>
    </div>

    <div id="examsList">
      <div class="loading"><div class="spinner"></div>در حال بارگذاری...</div>
    </div>

  </main>

  <!-- Modal آپلود -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal">
      <h3>📄 آپلود آزمون جدید</h3>

      <div class="form-group">
        <label>عنوان آزمون</label>
        <input type="text" id="examTitle" class="form-input" 
               placeholder="مثلاً: ریاضی فصل ۳" maxlength="100">
      </div>

      <div class="form-group">
        <label>توضیح (اختیاری)</label>
        <input type="text" id="examDesc" class="form-input" 
               placeholder="توضیح کوتاه" maxlength="200">
      </div>

      <div class="form-group">
        <label>فایل HTML</label>
        <div class="upload-zone" id="uploadZone">
          <span class="upload-icon">📁</span>
          <p class="upload-text">
            فایل HTML رو انتخاب کن یا اینجا رها کن<br>
            <b>حداکثر ۱۰ مگابایت</b>
          </p>
          <input type="file" id="fileInput" accept=".html,.htm" hidden>
        </div>
        <div id="filePreview"></div>
        <div class="progress-bar" id="progressBar" style="display:none;">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" id="uploadBtn" onclick="uploadExam()" disabled>
          آپلود
        </button>
        <button class="btn btn-secondary" onclick="closeUploadModal()">
          لغو
        </button>
      </div>
    </div>
  </div>

  <script src="js/errors.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/teacher.js"></script>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/utils.js"></script>
<script src="js/errors.js"></script>
<script src="js/auth.js"></script>
<script src="js/a11y.js"></script>
<!-- اسکریپت مخصوص صفحه -->
</html>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="js/a11y.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initAccessibility);
</script>
