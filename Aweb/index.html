<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ورود | سامانه آزمون</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="آزمون">

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">📝</div>
      <h1>سامانه آزمون</h1>
      <p class="subtitle">کد ۶ رقمی خود را وارد کنید</p>
    </div>

    <div class="code-input-wrap">
      <input
        type="text"
        id="codeInput"
        class="code-input"
        maxlength="6"
        inputmode="numeric"
        pattern="[0-9]{6}"
        placeholder="------"
        autocomplete="off"
        autofocus
      >
    </div>

    <button class="btn btn-primary btn-block" id="loginBtn" onclick="login()">
      ورود به سامانه
    </button>

    <div class="auth-msg" id="msg"></div>

    <div class="auth-footer">
      <button class="theme-toggle" onclick="toggleTheme()" title="تغییر تم">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================
    // اتصال به Supabase
    // ============================================
    const SUPABASE_URL = 'https://cfkwvzbqgapguuaqibmq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Qf3R9hPgjApwe2c-qQMoJA_jitobazq';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============================================
    // المان‌ها
    // ============================================
    const msg = document.getElementById('msg');
    const btn = document.getElementById('loginBtn');
    const input = document.getElementById('codeInput');

    // ============================================
    // فقط اعداد، حداکثر ۶ رقم
    // ============================================
    input.addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });

    // Enter برای ورود
    input.addEventListener('keypress', e => {
      if (e.key === 'Enter') login();
    });

    // ============================================
    // ورود
    // ============================================
    async function login() {
      const code = input.value.trim();

      if (code.length !== 6) {
        showMsg('کد باید ۶ رقم باشه', 'error');
        return;
      }

      if (!/^\d{6}$/.test(code)) {
        showMsg('کد باید فقط شامل اعداد باشه', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'در حال ورود...';
      msg.textContent = '';
      msg.className = 'auth-msg';

      const email = code + '@exam.local';
      const password = code + code;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          console.error('Login error:', error);
          showMsg('❌ کد معتبر نیست', 'error');
          btn.disabled = false;
          btn.textContent = 'ورود به سامانه';
          input.select();
          return;
        }

        // گرفتن پروفایل
        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('role, full_name, name_confirmed')
          .eq('id', data.user.id)
          .single();

        if (profileError) {
          console.error('Profile error:', profileError);
          showMsg('❌ خطا در بارگذاری اطلاعات', 'error');
          btn.disabled = false;
          btn.textContent = 'ورود به سامانه';
          return;
        }

        // اگه اسم تأیید نشده → صفحه انتخاب نام
        if (!profile.name_confirmed) {
          window.location.href = 'choose-name.html';
          return;
        }

        // تأیید شده → برو پنل
        if (profile.role === 'teacher') {
          window.location.href = 'teacher.html';
        } else {
          window.location.href = 'student.html';
        }

      } catch (err) {
        console.error('Unexpected error:', err);
        showMsg('❌ خطای غیرمنتظره: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'ورود به سامانه';
      }
    }

    // ============================================
    // نمایش پیام
    // ============================================
    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'auth-msg ' + (type || '');
    }

    // ============================================
    // تم
    // ============================================
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      const isDark = document.body.classList.contains('dark');
      icon.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // بازیابی تم
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeIcon').textContent = '☀️';
    }
  </script>
</body>
</html>
