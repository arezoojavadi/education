<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آزمون">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/skeletons.css">
<link rel="stylesheet" href="css/print.css" media="print">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="آزمون">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انتخاب نام</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">👋</div>
      <h1>خوش آمدی!</h1>
      <p class="subtitle">
        برای شروع، اسم واقعی‌ت رو وارد کن.<br>
        این اسم در همه‌ی آزمون‌ها نمایش داده می‌شه.
      </p>
    </div>

    <div class="code-badge" id="codeBadge">کد: ----</div>

    <div class="warning-box">
      ⚠️ <b>توجه مهم:</b> بعد از تأیید، دیگه <b>نمی‌تونی</b> اسمت رو تغییر بدی.
    </div>

    <input 
      type="text" 
      id="nameInput" 
      class="text-input"
      placeholder="نام و نام خانوادگی" 
      maxlength="60"
      autocomplete="off"
      autofocus
    >

    <button class="btn btn-primary btn-block" id="saveBtn" onclick="saveName()">
      تأیید و ادامه
    </button>

    <div class="auth-msg" id="msg"></div>
  </div>

  <script src="js/errors.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xxxxx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOi...';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const nameInput = document.getElementById('nameInput');
    const saveBtn = document.getElementById('saveBtn');
    const msg = document.getElementById('msg');
    const codeBadge = document.getElementById('codeBadge');

    let currentUser = null;

    nameInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') saveName();
    });

    async function saveName() {
      const name = nameInput.value.trim().replace(/\s+/g, ' ');

      if (name.length < 3) {
        showMsg('❌ اسم باید حداقل ۳ حرف باشه', 'error'); return;
      }
      if (name.length > 60) {
        showMsg('❌ اسم خیلی طولانیه', 'error'); return;
      }
      if (!/^[\u0600-\u06FF\s\u200c A-Za-z]+$/.test(name)) {
        showMsg('❌ فقط حروف فارسی یا انگلیسی مجازن', 'error'); return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'در حال ذخیره...';

      const { error } = await supabase
        .from('profiles')
        .update({ 
          full_name: name, 
          name_confirmed: true 
        })
        .eq('id', currentUser.id);

      if (error) {
        console.error(error);
        showMsg('❌ خطا: ' + error.message, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'تأیید و ادامه';
        return;
      }

      saveBtn.textContent = '✅ ذخیره شد!';
      showMsg('در حال انتقال...', 'success');

      const { data: profile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', currentUser.id)
        .single();

      setTimeout(() => {
        window.location.href = profile.role === 'teacher' 
          ? 'teacher.html' 
          : 'student.html';
      }, 800);
    }

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'auth-msg ' + type;
    }

    (async () => {
      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;

      const { data: profile } = await supabase
        .from('profiles')
        .select('code, name_confirmed, role')
        .eq('id', user.id)
        .single();

      if (profile?.name_confirmed === true) {
        window.location.href = profile.role === 'teacher' 
          ? 'teacher.html' 
          : 'student.html';
        return;
      }

      codeBadge.textContent = 'کد: ' + (profile?.code || '----');
    })();
  </script>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/utils.js"></script>
<script src="js/errors.js"></script>
<script src="js/auth.js"></script>
<script src="js/a11y.js"></script>

</html>
