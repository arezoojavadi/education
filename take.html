<meta name="theme-color" content="#6C5CE7">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="آزمون">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>در حال آزمون</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="take-header">
    <div>
      <strong id="examTitle">در حال بارگذاری...</strong>
    </div>
    <div class="timer" id="timer">
      <span>⏱</span>
      <span id="timerText">--:--</span>
    </div>
  </header>

  <main class="container">

    <div id="loading" class="loading">
      <div class="spinner"></div>
      در حال بارگذاری آزمون...
    </div>

    <div id="examContent" style="display:none;">
      <div class="exam-frame-wrap">
        <iframe id="examFrame" class="exam-frame"></iframe>
      </div>

      <div class="take-footer">
        <button class="btn btn-success" 
                style="padding:16px 48px; font-size:17px;"
                onclick="submitExam()" 
                id="submitBtn">
          ✅ ثبت نهایی و ارسال به معلم
        </button>
      </div>
    </div>

  </main>

  <script src="js/errors.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/take.js"></script>
</body>
