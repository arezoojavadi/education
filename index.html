<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>سامانه آزمون | فاطمه جوادی</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#6C5CE7">

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ============ Reset ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --primary: #6C5CE7;
      --primary-2: #A29BFE;
      --accent: #00CEC9;
      --accent-2: #55EFC4;
      --pink: #FD79A8;
      --danger: #FF6B6B;
      --success: #00B894;
      --bg-1: #EDE9FE;
      --bg-2: #DBEAFE;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.9);
      --text: #1F1B3A;
      --text-muted: #6B6789;
      --input-bg: rgba(255, 255, 255, 0.6);
      --input-border: rgba(108, 92, 231, 0.15);
      --shadow: 0 20px 60px rgba(108, 92, 231, 0.18);
      --glow: rgba(108, 92, 231, 0.4);
    }

    body.dark {
      --primary: #A29BFE;
      --primary-2: #6C5CE7;
      --accent: #00CEC9;
      --pink: #FD79A8;
      --bg-1: #0A0820;
      --bg-2: #1A0F35;
      --card-bg: rgba(26, 22, 56, 0.7);
      --card-border: rgba(162, 155, 254, 0.2);
      --text: #F5F3FF;
      --text-muted: #A8A3C7;
      --input-bg: rgba(15, 12, 35, 0.6);
      --input-border: rgba(162, 155, 254, 0.25);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      --glow: rgba(162, 155, 254, 0.5);
    }

    html, body {
      min-height: 100vh;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      color: var(--text);
      overflow-x: hidden;
      transition: color 0.5s ease;
    }

    /* ============ Background ============ */
    .bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      transition: background 0.8s ease;
      z-index: -3;
    }

    /* گرید متحرک - شبیه کد */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108, 92, 231, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108, 92, 231, 0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
      animation: gridMove 20s linear infinite;
      transition: opacity 0.5s;
    }

    body.dark .bg-grid {
      background-image:
        linear-gradient(rgba(162, 155, 254, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(162, 155, 254, 0.08) 1px, transparent 1px);
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 40px 40px; }
    }

    /* حباب‌های نوری */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: -1;
      transition: background 0.6s ease;
    }

    .blob-1 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      top: -150px; right: -150px;
      animation: float1 22s ease-in-out infinite;
    }

    .blob-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      bottom: -120px; left: -120px;
      animation: float2 25s ease-in-out infinite;
    }

    .blob-3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, var(--pink) 0%, transparent 70%);
      top: 40%; left: 30%;
      animation: float3 28s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-60px, 80px) scale(1.15); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(80px, -60px) scale(1.1); }
    }

    @keyframes float3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-50px, 50px) scale(0.9); }
      66% { transform: translate(50px, -30px) scale(1.1); }
    }

    /* ============ آیکون‌های شناور تکنولوژی ============ */
    .float-icons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .float-icon {
      position: absolute;
      font-size: 28px;
      opacity: 0.15;
      animation: floatAround 18s ease-in-out infinite;
      transition: opacity 0.5s;
    }

    body.dark .float-icon { opacity: 0.25; }

    @keyframes floatAround {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(15deg); }
    }

    .float-icon:nth-child(1) { top: 10%; left: 8%; animation-delay: 0s; }
    .float-icon:nth-child(2) { top: 20%; right: 12%; animation-delay: 2s; }
    .float-icon:nth-child(3) { bottom: 15%; left: 15%; animation-delay: 4s; }
    .float-icon:nth-child(4) { bottom: 25%; right: 10%; animation-delay: 6s; }
    .float-icon:nth-child(5) { top: 45%; left: 5%; animation-delay: 8s; }
    .float-icon:nth-child(6) { top: 60%; right: 6%; animation-delay: 10s; }
    .float-icon:nth-child(7) { top: 15%; left: 45%; animation-delay: 12s; }
    .float-icon:nth-child(8) { bottom: 8%; right: 45%; animation-delay: 14s; }

    /* ============ Theme Toggle ============ */
    .theme-toggle {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.15);
      z-index: 100;
      overflow: hidden;
    }

    .theme-toggle:hover {
      transform: translateY(-3px) rotate(-10deg);
      box-shadow: 0 12px 32px var(--glow);
    }

    .theme-toggle:active { transform: scale(0.92); }

    /* ============ Card ============ */
    .login-wrap {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 44px 36px 32px;
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      box-shadow: var(--shadow);
      animation: cardIn 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      transition: background 0.5s, border 0.5s, box-shadow 0.5s;
      position: relative;
      overflow: hidden;
    }

    /* خط رنگی بالای کارت */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--pink), var(--primary));
      background-size: 300% 100%;
      animation: shimmer 4s linear infinite;
    }

    @keyframes shimmer {
      from { background-position: 0% 0; }
      to { background-position: 300% 0; }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============ Logo ============ */
    .logo-wrap {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-circle {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 26px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 16px 40px var(--glow);
      animation: logoBounce 1s cubic-bezier(0.3, 1.5, 0.6, 1) 0.2s both;
      position: relative;
    }

    .logo-circle::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent), var(--pink));
      opacity: 0.5;
      filter: blur(16px);
      z-index: -1;
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }

    @keyframes logoBounce {
      0% { opacity: 0; transform: scale(0.3) rotate(-25deg); }
      60% { opacity: 1; transform: scale(1.12) rotate(8deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    /* حلقه‌ی چرخان دور لوگو */
    .logo-circle::after {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 38px;
      border: 2px dashed rgba(108, 92, 231, 0.3);
      animation: rotate 20s linear infinite;
    }

    body.dark .logo-circle::after {
      border-color: rgba(162, 155, 254, 0.3);
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    .title {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, var(--pink) 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      animation: gradientShift 5s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 500;
      line-height: 1.7;
    }

    .designer-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.1), rgba(0, 206, 201, 0.1));
      border: 1px solid rgba(108, 92, 231, 0.2);
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.3px;
      animation: fadeIn 1s ease 0.8s both;
    }

    body.dark .designer-tag {
      background: linear-gradient(135deg, rgba(162, 155, 254, 0.15), rgba(0, 206, 201, 0.15));
      border-color: rgba(162, 155, 254, 0.3);
      color: var(--primary-2);
    }

    .designer-tag .spark {
      animation: sparkle 2s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.3) rotate(20deg); opacity: 0.7; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ OTP Label ============ */
    .otp-label {
      text-align: center;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .otp-label::before,
    .otp-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--input-border), transparent);
    }

    /* ============ OTP Input ============ */
    .otp-input {
      display: flex;
      gap: 10px;
      direction: ltr;
      justify-content: center;
      margin-bottom: 22px;
    }

    .otp-input input {
      width: 54px;
      height: 66px;
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      font-family: 'Vazirmatn', monospace;
      background: var(--input-bg);
      border: 2px solid var(--input-border);
      border-radius: 16px;
      color: var(--text);
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      caret-color: var(--primary);
      position: relative;
    }

    .otp-input input:hover {
      border-color: var(--primary-2);
    }

    .otp-input input:focus {
      border-color: var(--primary);
      background: var(--card-bg);
      transform: translateY(-4px) scale(1.06);
      box-shadow: 0 12px 28px var(--glow);
    }

    .otp-input input.filled {
      border-color: var(--primary);
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.12), rgba(0, 206, 201, 0.12));
      animation: digitIn 0.3s cubic-bezier(0.4, 1.5, 0.6, 1);
    }

    @keyframes digitIn {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .otp-input input.error {
      border-color: var(--danger);
      background: rgba(255, 107, 107, 0.1);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    /* ============ Button ============ */
    .btn-login {
      width: 100%;
      padding: 18px;
      font-size: 17px;
      font-weight: 800;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      background-size: 200% 200%;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 28px var(--glow);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.5s ease;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px var(--glow);
      background-position: 100% 50%;
    }

    .btn-login:hover:not(:disabled)::before {
      left: 100%;
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(-1px) scale(0.99);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-login .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============ Message ============ */
    .msg {
      margin-top: 16px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      min-height: 20px;
      padding: 12px 18px;
      border-radius: 14px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(-10px);
      max-height: 0;
      overflow: hidden;
    }

    .msg.show {
      opacity: 1;
      transform: translateY(0);
      max-height: 100px;
    }

    .msg.error {
      background: rgba(255, 107, 107, 0.12);
      color: var(--danger);
      border: 1px solid rgba(255, 107, 107, 0.2);
    }

    .msg.success {
      background: rgba(0, 184, 148, 0.12);
      color: var(--success);
      border: 1px solid rgba(0, 184, 148, 0.2);
    }

    /* ============ Footer ============ */
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11.5px;
      color: var(--text-muted);
      opacity: 0.7;
      font-weight: 500;
    }

    .footer .heart {
      display: inline-block;
      color: var(--pink);
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    /* ============ Responsive ============ */
    @media (max-width: 480px) {
      .login-card {
        padding: 36px 22px 26px;
        border-radius: 28px;
      }

      .logo-circle { width: 72px; height: 72px; font-size: 34px; border-radius: 22px; }
      .title { font-size: 24px; }
      .subtitle { font-size: 12.5px; }

      .otp-input { gap: 6px; }
      .otp-input input {
        width: 46px;
        height: 56px;
        font-size: 24px;
        border-radius: 13px;
      }

      .btn-login { padding: 16px; font-size: 15.5px; }
      .theme-toggle { top: 16px; left: 16px; width: 46px; height: 46px; font-size: 20px; }
    }

    @media (max-width: 360px) {
      .otp-input input { width: 40px; height: 50px; font-size: 21px; }
      .otp-input { gap: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg"></div>
  <div class="bg-grid"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Floating Tech Icons -->
  <div class="float-icons">
    <div class="float-icon">💻</div>
    <div class="float-icon">🤖</div>
    <div class="float-icon">📚</div>
    <div class="float-icon">🚀</div>
    <div class="float-icon">⚡</div>
    <div class="float-icon">🎯</div>
    <div class="float-icon">🧠</div>
    <div class="float-icon">✨</div>
  </div>

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تغییر حالت" aria-label="تغییر تم">
    <span id="themeIcon">🌙</span>
  </button>

  <!-- Login Card -->
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-wrap">
        <div class="logo-circle">📝</div>
        <h1 class="title">سامانه آزمون</h1>
        <p class="subtitle">برای شروع، کد ورود ۶ رقمی خود را وارد کنید</p>
        <div class="designer-tag">
          <span class="spark">✨</span>
          طراحی از فاطمه جوادی
        </div>
      </div>

      <div class="otp-label">کد ۶ رقمی</div>

      <div class="otp-input" id="otpInput" dir="ltr">
        <input type="text" inputmode="numeric" maxlength="1" data-index="0" autocomplete="off" aria-label="رقم ۱">
        <input type="text" inputmode="numeric" maxlength="1" data-index="1" autocomplete="off" aria-label="رقم ۲">
        <input type="text" inputmode="numeric" maxlength="1" data-index="2" autocomplete="off" aria-label="رقم ۳">
        <input type="text" inputmode="numeric" maxlength="1" data-index="3" autocomplete="off" aria-label="رقم ۴">
        <input type="text" inputmode="numeric" maxlength="1" data-index="4" autocomplete="off" aria-label="رقم ۵">
        <input type="text" inputmode="numeric" maxlength="1" data-index="5" autocomplete="off" aria-label="رقم ۶">
      </div>

      <button class="btn-login" id="loginBtn" onclick="login()">
        <span>ورود به سامانه</span>
      </button>

      <div class="msg" id="msg"></div>

      <div class="footer">
        ساخته شده با <span class="heart">♥</span> برای یادگیری بهتر
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================
    // Supabase
    // ============================================
    const SUPABASE_URL = 'https://cfkwvzbqgapguuaqibmq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Qf3R9hPgjApwe2c-qQMoJA_jitobazq';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============================================
    // Elements
    // ============================================
    const inputs = document.querySelectorAll('#otpInput input');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('loginBtn');

    // ============================================
    // OTP Logic
    // ============================================
    function getCode() {
      return Array.from(inputs).map(i => i.value).join('');
    }

    function clearError() {
      inputs.forEach(i => i.classList.remove('error'));
      msg.classList.remove('show');
    }

    inputs.forEach((input, idx) => {
      // تایپ → برو بعدی
      input.addEventListener('input', e => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val.slice(-1);
        clearError();

        if (e.target.value) {
          e.target.classList.add('filled');
          // انیمیشن + برو بعدی
          if (idx < inputs.length - 1) {
            inputs[idx + 1].focus();
          } else {
            // آخرین خانه
            input.blur();
            if (getCode().length === 6) {
              setTimeout(() => login(), 200);
            }
          }
        } else {
          e.target.classList.remove('filled');
        }
      });

      // کیبورد
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace') {
          if (!e.target.value) {
            // خالی → برو عقب و پاک کن
            if (idx > 0) {
              e.preventDefault();
              inputs[idx - 1].focus();
              inputs[idx - 1].value = '';
              inputs[idx - 1].classList.remove('filled');
              clearError();
            }
          } else {
            // پر → فقط پاک کن
            e.target.value = '';
            e.target.classList.remove('filled');
            clearError();
          }
        } else if (e.key === 'ArrowLeft') {
          if (idx > 0) { e.preventDefault(); inputs[idx - 1].focus(); }
        } else if (e.key === 'ArrowRight') {
          if (idx < inputs.length - 1) { e.preventDefault(); inputs[idx + 1].focus(); }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          login();
        } else if (e.key === 'Delete') {
          e.target.value = '';
          e.target.classList.remove('filled');
        }
      });

      // Paste
      input.addEventListener('paste', e => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text');
        const digits = text.replace(/\D/g, '').slice(0, 6);

        if (!digits) return;

        inputs.forEach((inp, i) => {
          if (i < digits.length) {
            inp.value = digits[i];
            inp.classList.add('filled');
          } else {
            inp.value = '';
            inp.classList.remove('filled');
          }
        });

        clearError();
        if (digits.length === 6) {
          inputs[5].blur();
          setTimeout(() => login(), 200);
        } else {
          inputs[Math.min(digits.length, 5)].focus();
        }
      });

      // فوکوس
      input.addEventListener('focus', e => e.target.select());
    });

    // فوکوس اولیه
    setTimeout(() => inputs[0].focus(), 300);

    // ============================================
    // ورود
    // ============================================
    async function login() {
      const code = getCode();

      if (code.length !== 6) {
        showError('کد باید ۶ رقم باشه');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>در حال ورود</span><span class="spinner"></span>';
      clearError();

      const email = code + '@exam.local';
      const password = code + code;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          console.error('Login error:', error);
          showError('کد وارد شده معتبر نیست');
          return;
        }

        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('role, full_name, name_confirmed')
          .eq('id', data.user.id)
          .single();

        if (profileError) {
          console.error('Profile error:', profileError);
          showError('خطا در بارگذاری اطلاعات');
          return;
        }

        // اگه اسم تأیید نشده
        if (!profile.name_confirmed) {
          window.location.href = 'choose-name.html';
          return;
        }

        // موفق
        msg.textContent = '✅ خوش آمدی! در حال انتقال...';
        msg.className = 'msg success show';
        btn.innerHTML = '<span>✅ موفق</span>';

        setTimeout(() => {
          window.location.href = profile.role === 'teacher' ? 'teacher.html' : 'student.html';
        }, 600);

      } catch (err) {
        console.error('Unexpected error:', err);
        showError('خطای غیرمنتظره، دوباره تلاش کن');
      }
    }

    // ============================================
    // پیام خطا
    // ============================================
    function showError(text) {
      inputs.forEach(i => i.classList.add('error'));
      msg.textContent = text;
      msg.className = 'msg error show';
      btn.disabled = false;
      btn.innerHTML = '<span>ورود به سامانه</span>';

      setTimeout(() => {
        inputs.forEach(i => {
          i.classList.remove('error');
          i.value = '';
          i.classList.remove('filled');
        });
        inputs[0].focus();
      }, 500);
    }

    // ============================================
    // تم — با کلاس روی <html> که مطمئن‌تره
    // ============================================
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      document.body.classList.toggle('dark', isDark);
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');

      // آپدیت meta theme-color
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = isDark ? '#0A0820' : '#6C5CE7';
    }

    // بازیابی تم
    (function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark');
        document.getElementById('themeIcon').textContent = '☀️';
      }
    })();
  </script>
</body>
