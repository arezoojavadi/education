<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ورود | سامانه آزمون</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#6C5CE7">

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ============ Reset ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --primary: #6C5CE7;
      --primary-2: #A29BFE;
      --accent: #00CEC9;
      --danger: #FF6B6B;
      --success: #00B894;
      --bg-1: #F5F3FF;
      --bg-2: #E8E3FF;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.6);
      --text: #1F1B3A;
      --text-muted: #6B6789;
      --input-bg: rgba(255, 255, 255, 0.7);
      --input-border: rgba(108, 92, 231, 0.15);
      --input-focus: #6C5CE7;
      --shadow: 0 20px 60px rgba(108, 92, 231, 0.15);
      --blob-1: #A29BFE;
      --blob-2: #00CEC9;
      --blob-3: #FFB8B8;
    }

    body.dark {
      --bg-1: #0A0820;
      --bg-2: #150F35;
      --card-bg: rgba(26, 22, 56, 0.85);
      --card-border: rgba(162, 155, 254, 0.15);
      --text: #F5F3FF;
      --text-muted: #A8A3C7;
      --input-bg: rgba(15, 12, 35, 0.6);
      --input-border: rgba(162, 155, 254, 0.2);
      --input-focus: #A29BFE;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      --blob-1: #4B3F8E;
      --blob-2: #1A7B78;
      --blob-3: #7B3F52;
    }

    html, body {
      height: 100%;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ============ Background ============ */
    .bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      transition: background 0.6s ease;
      z-index: -2;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 20s ease-in-out infinite;
      z-index: -1;
      transition: background 0.6s ease;
    }

    .blob-1 {
      width: 400px; height: 400px;
      background: var(--blob-1);
      top: -100px; right: -100px;
      animation-delay: 0s;
    }

    .blob-2 {
      width: 350px; height: 350px;
      background: var(--blob-2);
      bottom: -100px; left: -100px;
      animation-delay: -5s;
    }

    .blob-3 {
      width: 300px; height: 300px;
      background: var(--blob-3);
      top: 50%; left: 50%;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -50px) scale(1.1); }
      66% { transform: translate(-40px, 30px) scale(0.95); }
    }

    /* ============ Theme Toggle ============ */
    .theme-toggle {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.15);
      z-index: 100;
    }

    .theme-toggle:hover {
      transform: rotate(20deg) scale(1.1);
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.3);
    }

    .theme-toggle:active { transform: scale(0.95); }

    /* ============ Card ============ */
    .login-wrap {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 48px 40px 40px;
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      box-shadow: var(--shadow);
      animation: cardIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      transition: background 0.4s, border 0.4s;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary-2));
      background-size: 200% 100%;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      from { background-position: 0% 0; }
      to { background-position: 200% 0; }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============ Logo & Header ============ */
    .logo-wrap {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-circle {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 12px 32px rgba(108, 92, 231, 0.35);
      animation: bounceIn 0.8s cubic-bezier(0.3, 1.5, 0.6, 1) 0.2s both;
      position: relative;
    }

    .logo-circle::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent), var(--primary-2));
      opacity: 0.4;
      filter: blur(12px);
      z-index: -1;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3) rotate(-20deg); }
      60% { opacity: 1; transform: scale(1.1) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    .title {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ============ OTP Input ============ */
    .otp-label {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .otp-label::before,
    .otp-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--input-border), transparent);
    }

    .otp-input {
      display: flex;
      gap: 10px;
      direction: ltr;
      justify-content: center;
      margin-bottom: 24px;
    }

    .otp-input input {
      width: 52px;
      height: 64px;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      font-family: 'Vazirmatn', monospace;
      background: var(--input-bg);
      border: 2px solid var(--input-border);
      border-radius: 16px;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
      caret-color: var(--primary);
    }

    .otp-input input:focus {
      border-color: var(--input-focus);
      background: var(--card-bg);
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.25);
    }

    .otp-input input.filled {
      border-color: var(--primary);
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.1), rgba(162, 155, 254, 0.1));
    }

    .otp-input input.error {
      border-color: var(--danger);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* ============ Button ============ */
    .btn-login {
      width: 100%;
      padding: 18px;
      font-size: 17px;
      font-weight: 800;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      border: none;
      border-radius: 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
      letter-spacing: 0.3px;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(108, 92, 231, 0.5);
    }

    .btn-login:hover:not(:disabled)::before {
      width: 400px;
      height: 400px;
    }

    .btn-login:active:not(:disabled) { transform: translateY(0) scale(0.98); }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
    }

    .btn-login .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============ Message ============ */
    .msg {
      margin-top: 16px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 600;
      min-height: 20px;
      padding: 10px 16px;
      border-radius: 12px;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(-8px);
    }

    .msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    .msg.error {
      background: rgba(255, 107, 107, 0.12);
      color: var(--danger);
    }

    .msg.success {
      background: rgba(0, 184, 148, 0.12);
      color: var(--success);
    }

    /* ============ Responsive ============ */
    @media (max-width: 480px) {
      .login-card {
        padding: 40px 24px 32px;
        border-radius: 28px;
      }

      .logo-circle { width: 68px; height: 68px; font-size: 34px; }
      .title { font-size: 24px; }

      .otp-input { gap: 6px; }
      .otp-input input {
        width: 44px;
        height: 54px;
        font-size: 22px;
        border-radius: 13px;
      }

      .btn-login { padding: 16px; font-size: 16px; }
      .theme-toggle { top: 16px; left: 16px; width: 42px; height: 42px; font-size: 20px; }
    }

    @media (max-width: 360px) {
      .otp-input input { width: 38px; height: 48px; font-size: 20px; }
      .otp-input { gap: 4px; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تغییر حالت">
    <span id="themeIcon">🌙</span>
  </button>

  <!-- Login Card -->
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-wrap">
        <div class="logo-circle">📝</div>
        <h1 class="title">سامانه آزمون</h1>
        <p class="subtitle">برای شروع، کد ورود خود را وارد کنید</p>
      </div>

      <div class="otp-label">کد ۶ رقمی</div>

      <div class="otp-input" id="otpInput" dir="ltr">
        <input type="text" inputmode="numeric" maxlength="1" data-index="0" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" data-index="1" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" data-index="2" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" data-index="3" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" data-index="4" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" data-index="5" autocomplete="off">
      </div>

      <button class="btn-login" id="loginBtn" onclick="login()">
        ورود به سامانه
      </button>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================
    // Supabase
    // ============================================
    const SUPABASE_URL = 'https://cfkwvzbqgapguuaqibmq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Qf3R9hPgjApwe2c-qQMoJA_jitobazq';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============================================
    // OTP Input
    // ============================================
    const inputs = document.querySelectorAll('#otpInput input');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('loginBtn');

    function getCode() {
      return Array.from(inputs).map(i => i.value).join('');
    }

    function clearError() {
      inputs.forEach(i => i.classList.remove('error'));
      msg.classList.remove('show');
    }

    inputs.forEach((input, idx) => {
      // فقط عدد
      input.addEventListener('input', e => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1);
        clearError();

        if (e.target.value) {
          e.target.classList.add('filled');
          // فوکوس خودکار روی خانه بعد
          if (idx < inputs.length - 1) {
            inputs[idx + 1].focus();
          } else {
            // آخرین خانه پر شد → ورود خودکار
            input.blur();
            if (getCode().length === 6) {
              setTimeout(login, 150);
            }
          }
        } else {
          e.target.classList.remove('filled');
        }
      });

      // Backspace → برگرد به عقب
      input.addEventListener('keydown', e => {
        if (e.key === 'Backspace') {
          if (!e.target.value && idx > 0) {
            inputs[idx - 1].focus();
            inputs[idx - 1].value = '';
            inputs[idx - 1].classList.remove('filled');
          } else {
            e.target.classList.remove('filled');
          }
        }
        if (e.key === 'ArrowLeft' && idx > 0) inputs[idx - 1].focus();
        if (e.key === 'ArrowRight' && idx < 5) inputs[idx + 1].focus();
        if (e.key === 'Enter') login();
      });

      // Paste → توزیع در همه خانه‌ها
      input.addEventListener('paste', e => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text');
        const digits = text.replace(/\D/g, '').slice(0, 6);

        inputs.forEach((inp, i) => {
          if (i < digits.length) {
            inp.value = digits[i];
            inp.classList.add('filled');
          } else {
            inp.value = '';
            inp.classList.remove('filled');
          }
        });

        clearError();
        if (digits.length === 6) {
          inputs[5].blur();
          setTimeout(login, 150);
        } else {
          inputs[Math.min(digits.length, 5)].focus();
        }
      });

      // کلیک → انتخاب محتوا
      input.addEventListener('focus', e => e.target.select());
    });

    // فوکوس اولیه روی خانه اول
    inputs[0].focus();

    // ============================================
    // ورود
    // ============================================
    async function login() {
      const code = getCode();

      if (code.length !== 6) {
        showError('کد باید ۶ رقم باشه');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = 'در حال ورود<span class="spinner"></span>';
      clearError();

      const email = code + '@exam.local';
      const password = code + code;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          console.error('Login error:', error);
          showError('کد وارد شده معتبر نیست');
          return;
        }

        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('role, full_name, name_confirmed')
          .eq('id', data.user.id)
          .single();

        if (profileError) {
          console.error('Profile error:', profileError);
          showError('خطا در بارگذاری اطلاعات');
          return;
        }

        // اگه اسم تأیید نشده
        if (!profile.name_confirmed) {
          window.location.href = 'choose-name.html';
          return;
        }

        window.location.href = profile.role === 'teacher' ? 'teacher.html' : 'student.html';

      } catch (err) {
        console.error('Unexpected error:', err);
        showError('خطای غیرمنتظره، دوباره تلاش کن');
      }
    }

    // ============================================
    // پیام خطا
    // ============================================
    function showError(text) {
      inputs.forEach(i => i.classList.add('error'));
      msg.textContent = text;
      msg.className = 'msg error show';
      btn.disabled = false;
      btn.innerHTML = 'ورود به سامانه';

      // لرزش کد
      setTimeout(() => {
        inputs.forEach(i => i.classList.remove('error'));
      }, 500);

      // فوکوس روی خانه اول
      inputs[0].focus();
      inputs.forEach(i => {
        i.value = '';
        i.classList.remove('filled');
      });
    }

    // ============================================
    // تم
    // ============================================
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // بازیابی تم
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeIcon').textContent = '☀️';
    }
  </script>
</body>
</html>
